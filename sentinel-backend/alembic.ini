# =========================================================
# ALEMBIC CONFIGURATION - SENTINEL NER
# =========================================================

[alembic]

# Location of migration scripts
script_location = %(here)s/alembic

# Add project root to Python path
prepend_sys_path = .

# Use OS-specific path separator
path_separator = os

# Encoding for generated migration files
output_encoding = utf-8


# =========================================================
# DATABASE CONNECTION
# =========================================================
#
# PostgreSQL database:
# Host: 127.0.0.1
# Port: 5432
# Database: sentinel_ner
# User: sentinel_app
#
# IMPORTANT:
# Replace YOUR_DB_PASSWORD with the actual password
# from your .env file.
# =========================================================

sqlalchemy.url = postgresql+psycopg2://sentinel_app:YOUR_DB_PASSWORD@127.0.0.1:5432/sentinel_ner


# =========================================================
# POST WRITE HOOKS
# =========================================================

[post_write_hooks]


# =========================================================
# LOGGING
# =========================================================

[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S